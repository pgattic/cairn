[package]
name = "cairn"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
gmp-mpfr-sys = { version = "1.6.4", default-features = false, features = [
    "use-system-libs",
] }
rug = { version = "1.27.0", default-features = false, features = [
    "integer",
    "std",
] }

[profile.release]
lto = true
panic = 'abort'
